name: Generate snake animation

on:
  schedule: # every 2 days at 00:00 UTC
    - cron: "0 0 */2 * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b0e13&color_dots=#ebe3d3,#efc2b0,#e39478,#d5512f,#8f2f1b
            dist/snake-dark.svg?palette=github-dark&color_snake=#ecdcb9&color_dots=#141922,#3a2320,#6b2f22,#a23f28,#d5512f


      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
